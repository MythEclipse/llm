[package]
name = "llm-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
llm-engine = { path = "../engine" }
axum = "0.8"
tokio = { workspace = true }
tower = "0.5"
tower-http = { version = "0.7", features = ["fs", "trace"] }
sea-orm = { version = "2.0", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros"] }
tokio-stream = { version = "0.1", features = ["sync"] }
rayon = "1"
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
zod-rs = "1.1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio = { workspace = true }
migration = { path = "../../.migrations" }
sea-orm-migration = { version = "2.0", features = ["runtime-tokio-rustls", "sqlx-sqlite"] }
